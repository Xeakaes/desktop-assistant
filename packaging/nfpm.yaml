name: nexadesk
arch: amd64
platform: linux
version: ${APP_VERSION}
section: utils
priority: optional
maintainer: Xeakaes <194935315+Xeakaes@users.noreply.github.com>
description: Desktop AI Assistant with chat GUI, avatar mode, and bundled screen-control.
license: MIT
replaces:
  - desktop-assistant
contents:
  - src: ./dist/NexaDesk
    dst: /opt/NexaDesk
    type: tree
  - src: ./packaging/nexadesk.desktop
    dst: /usr/share/applications/nexadesk.desktop
  - src: ./packaging/icon.png
    dst: /usr/share/icons/hicolor/256x256/apps/nexadesk.png
scripts:
  postinstall: ./packaging/postinstall.sh
