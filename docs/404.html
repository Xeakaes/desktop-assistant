<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — NexaDesk</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="/NexaDesk/favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/NexaDesk/styles.css">
  <style>
    .notfound {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0 24px;
    }
    .notfound-code {
      font-size: 60px;
      line-height: 1;
      font-weight: 700;
      color: var(--coral);
      margin: 0 0 16px;
    }
    .notfound h1 { margin: 0 0 8px; }
    .notfound p { color: var(--muted); margin: 0 0 32px; }
  </style>
</head>
<body>
  <main class="notfound">
    <div>
      <p class="notfound-code">404</p>
      <h1>Page not found</h1>
      <p>The page you are looking for does not exist.</p>
      <a href="/NexaDesk/" class="btn btn-primary">Back to NexaDesk</a>
    </div>
  </main>
</body>
</html>
